services:
  db:
    image: postgres:16
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_activity
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
    ports:
      - "5432:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_activity"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: campus-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://campus:campus123@db:5432/campus_activity
      JWT_SECRET: change-this-secret-before-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  campus_postgres_data:
